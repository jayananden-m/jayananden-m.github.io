# Optional: builds the blog and deploys to GitHub Pages on every push to main.
# With this enabled you only ever commit Markdown — the .html is built here,
# so you don't run build.py locally.
#
# To use it: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# If you'd rather keep committing the generated .html yourself, just delete
# this file and run `python build.py` before each push.

name: Build blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown pyyaml pygments

      - name: Build
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
